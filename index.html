<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>THE GAME WITH FUN</title>

  <style>
    /* ==========================================================================
       PREMIUM DARK GAMING / APP SPLASH THEME
       ========================================================================== */
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(16, 21, 36, 0.85);
      --neon-gold: #f59e0b;
      --neon-cyan: #00f0ff;
      --neon-purple: #8b5cf6;
      --neon-emerald: #10b981;
      
      --text-pure: #ffffff;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      font-family: var(--font-stack);
      color: var(--text-pure);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Glowing Lighting */
    body::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, transparent 70%);
      top: 15%;
      left: 10%;
      pointer-events: none;
      filter: blur(40px);
    }

    body::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
      bottom: 15%;
      right: 10%;
      pointer-events: none;
      filter: blur(40px);
    }

    /* Splash Card Container */
    .splash-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 400px;
      padding: 3rem 2rem;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Animated Glowing Logo */
    .logo-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 1.75rem;
      display: grid;
      place-items: center;
    }

    .glow-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #f59e0b, #00f0ff, #8b5cf6, #f59e0b);
      animation: rotateRing 2.5s linear infinite;
      filter: blur(2px);
    }

    .logo-core {
      position: relative;
      width: 80px;
      height: 80px;
      background: #0c101c;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--neon-gold);
      box-shadow: inset 0 0 16px rgba(0, 240, 255, 0.25);
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Title & Tagline */
    .brand-title {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      line-height: 1.2;
      margin-bottom: 0.35rem;
      background: linear-gradient(135deg, #f59e0b 0%, #00f0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tagline {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      margin-bottom: 2.25rem;
    }

    /* Loading Progress Area */
    .progress-box {
      width: 100%;
      margin-bottom: 1.25rem;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.7rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #00f0ff);
      border-radius: 9999px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
      animation: fillBar 3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes fillBar {
      0% { width: 0%; }
      30% { width: 35%; }
      70% { width: 78%; }
      100% { width: 100%; }
    }

    /* Dynamic Status Indicator */
    .status-text {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      min-height: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--neon-emerald);
      box-shadow: 0 0 8px var(--neon-emerald);
      animation: blink 1s ease-in-out infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.35; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       SPLASH / LOADING SCREEN (Redirects after 3 Seconds)
       ========================================================================== -->
  <main class="splash-container">
    <!-- Glowing Animated Logo -->
    <div class="logo-wrapper">
      <div class="glow-ring"></div>
      <div class="logo-core">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="6"></rect>
          <line x1="6" y1="12" x2="10" y2="12"></line>
          <line x1="8" y1="10" x2="8" y2="14"></line>
          <circle cx="16" cy="12" r="1"></circle>
          <circle cx="18" cy="10" r="1"></circle>
        </svg>
      </div>
    </div>

    <!-- Title & Tagline -->
    <h1 class="brand-title">THE GAME WITH FUN</h1>
    <div class="brand-tagline">Play • Complete • Enjoy</div>

    <!-- Progress Bar & Percentage -->
    <div class="progress-box">
      <div class="progress-meta">
        <span id="loadingPhase">INITIALIZING...</span>
        <span id="percentCount" style="color: var(--neon-cyan);">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>

    <!-- Dynamic Status Updates -->
    <div class="status-text">
      <span class="status-dot"></span>
      <span id="statusLabel">Connecting to secure servers...</span>
    </div>
  </main>

  <!-- ==========================================================================
       3-SECOND REDIRECT & FIREBASE CONFIG
       ========================================================================== -->
  <script>
    // ------------------------------------------------------------------------
    // 1. 3-SECOND COUNTDOWN & REDIRECT TO login.html
    // ------------------------------------------------------------------------
    const percentCount = document.getElementById('percentCount');
    const loadingPhase = document.getElementById('loadingPhase');
    const statusLabel = document.getElementById('statusLabel');

    const totalDuration = 3000; // 3 seconds
    const intervalTime = 30;    // 30ms step
    let elapsed = 0;

    const statusUpdates = [
      { at: 500,  phase: "LOADING MODULES...", status: "Syncing gaming system..." },
      { at: 1500, phase: "SECURING PORTAL...", status: "Validating environment..." },
      { at: 2400, phase: "PREPARING ACCESS...", status: "Entering platform arena..." },
      { at: 2900, phase: "SUCCESS!", status: "Redirecting to login..." }
    ];

    const timer = setInterval(() => {
      elapsed += intervalTime;
      const progress = Math.min(100, Math.floor((elapsed / totalDuration) * 100));
      percentCount.textContent = `${progress}%`;

      for (const update of statusUpdates) {
        if (elapsed >= update.at) {
          loadingPhase.textContent = update.phase;
          statusLabel.textContent = update.status;
        }
      }

      if (elapsed >= totalDuration) {
        clearInterval(timer);
        window.location.href = "login.html";
      }
    }, intervalTime);

    // ------------------------------------------------------------------------
    // 2. FIREBASE ARCHITECTURE CONFIGURATION
    // ------------------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCypPyOyk2gh42SS8z8bnK5emKQmr40v5U",
      authDomain: "game-with-fun-a1988.firebaseapp.com",
      databaseURL: "https://game-with-fun-a1988-default-rtdb.firebaseio.com",
      projectId: "game-with-fun-a1988",
      storageBucket: "game-with-fun-a1988.firebasestorage.app",
      messagingSenderId: "226037846599",
      appId: "1:226037846599:web:415dc67b9d06007646d762"
    };

    window.FIREBASE_CONFIG = firebaseConfig;
  </script>
</body>
</html>
